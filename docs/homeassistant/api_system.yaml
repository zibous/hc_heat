###############################################
# EMS SYSTEM SENSOR (/api/system)
###############################################

sensor:
  - platform: rest
    name: "EMS System"
    resource: "http://ems-heizung.siebler.home/api/system"
    method: GET
    value_template: "OK"
    scan_interval: 60
    json_attributes:
      - system
      - network
      - api
      - bus
      - ntp
      - settings
      - errorcode
      - status
      - lastcode

###############################################
# TEMPLATE SENSOR
###############################################

template:
  - sensor:

      ###################################
      # SYSTEM BASIS
      ###################################

      - name: "EMS Firmware Version"
        state: "{{ state_attr('sensor.ems_system','system')['version'] }}"

      - name: "EMS Uptime"
        state: "{{ state_attr('sensor.ems_system','system')['uptime'] }}"

      - name: "EMS Reset Grund"
        state: "{{ state_attr('sensor.ems_system','system')['resetReason'] }}"

      ###################################
      # NETZWERK
      ###################################

      - name: "EMS WLAN Signal"
        unit_of_measurement: "dBm"
        state: "{{ state_attr('sensor.ems_system','network')['RSSI'] | float(0) }}"

      - name: "EMS WLAN Reconnects"
        state: "{{ state_attr('sensor.ems_system','network')['WIFIReconnects'] | int(0) }}"

      - name: "EMS Netzwerk Modus"
        state: "{{ state_attr('sensor.ems_system','network')['network'] }}"

      ###################################
      # API GESUNDHEIT
      ###################################

      - name: "EMS API Calls"
        state: "{{ state_attr('sensor.ems_system','api')['APICalls'] | int(0) }}"

      - name: "EMS API Fehler"
        state: "{{ state_attr('sensor.ems_system','api')['APIFails'] | int(0) }}"

      ###################################
      # BUS KOMMUNIKATION (WICHTIG!)
      ###################################

      - name: "EMS Bus RX Qualität"
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.ems_system','bus')['busRxLineQuality'] | float(0) }}"

      - name: "EMS Bus TX Qualität"
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.ems_system','bus')['busTxLineQuality'] | float(0) }}"

      - name: "EMS Bus Fehler RX"
        state: "{{ state_attr('sensor.ems_system','bus')['busReadsFailed'] | int(0) }}"

      - name: "EMS Bus Fehler TX"
        state: "{{ state_attr('sensor.ems_system','bus')['busWritesFailed'] | int(0) }}"

      ###################################
      # SYSTEM STATUS
      ###################################

      - name: "EMS Anlagenstatus"
        state: "{{ state_attr('sensor.ems_system','status') }}"

      - name: "EMS Fehlercode"
        state: "{{ state_attr('sensor.ems_system','errorcode') }}"

      - name: "EMS Letzter Fehler"
        state: "{{ state_attr('sensor.ems_system','lastcode') }}"

      ###################################
      # HEALTH SCORE (SEHR PRAKTISCH)
      ###################################

      - name: "EMS System Gesundheit"
        state: >
          {% set rssi = state_attr('sensor.ems_system','network')['RSSI'] %}
          {% set bus = state_attr('sensor.ems_system','bus')['busRxLineQuality'] %}
          {% if rssi > -65 and bus > 90 %}
            Sehr gut
          {% elif rssi > -75 and bus > 80 %}
            Gut
          {% else %}
            Kritisch
          {% endif %}