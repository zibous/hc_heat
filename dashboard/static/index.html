<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heizungs-Dashboard v2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>

    <div class="header">
        <div class="title-info">
            <h1 id="title">Heizung · Dashboard</h1>
            <div class="subtitle" id="subtitle">Lade Konfiguration...</div>
        </div>
        <div class="header-right">
            <span id="header-update" style="font-size:.72rem;color:var(--text-muted)"></span>
            <button id="themeBtn" class="ibtn" style="background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1rem;">🌙</button>
        </div>
    </div>

    <div id="dashboard-container"></div>

    <footer style="text-align:center;color:var(--muted);font-size:.7rem;padding:16px">
        Heizungscontroller · Auto-Refresh <span id="refreshInterval">60</span>s
    </footer>

    <!-- DEV: einzelne Module -->
    <script type="module" src="js/v2/main.js"></script>
    <!-- PROD: gebundelt -->
    <!-- <script type="module" src="js/v2/main.bundle.js"></script> -->

</body>
</html>
