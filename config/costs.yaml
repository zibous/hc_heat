# Kosten-Konfiguration Heizungsanlage
#
# Gaspreise: Abrechnungszeitraum 01.09. bis 31.08. des Folgejahres
# Energiepreise (Strom): pro Kalenderjahr

gas:
  kwh_per_m3: 10.19           # Brennwert Erdgas (kWh pro m³)
  currency: "EUR"
  periods:
    - from: "2023-09-01"
      to: "2024-08-31"
      price_per_kwh: 0.0857
    - from: "2024-09-01"
      to: "2025-08-31"
      price_per_kwh: 0.1244
    - from: "2025-09-01"
      to: "2026-08-31"
      price_per_kwh: 0.1164

energy:
  currency: "EUR"
  periods:
    - year: 2024
      price_per_kwh: 0.18
    - year: 2025
      price_per_kwh: 0.23
    - year: 2026
      price_per_kwh: 0.24
